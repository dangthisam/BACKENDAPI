services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb-app
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net

  node-app:
    build: .
    container_name: node-backend-app
    restart: always
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - DB_HOST=mongodb://mongodb:27017/BackEndAPI
      - PORT=3000
    expose:
      - "3000"
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  mongo_data: